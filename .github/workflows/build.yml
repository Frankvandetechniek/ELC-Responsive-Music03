name: Build macOS app

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers || true
          swift --version
          swift scripts/list_sound_classes.swift || true

      # The runner may itself run under Rosetta (x86_64) on Apple Silicon; force native arm64
      # so the test bundle architecture matches the build.
      - name: Unit tests (core engine, sACN, analysis)
        run: |
          if [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = "1" ]; then
            arch -arm64 swift test
          else
            swift test
          fi

      - name: Build app bundle
        run: |
          if [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = "1" ]; then
            arch -arm64 ./scripts/build_app.sh
          else
            ./scripts/build_app.sh
          fi

      - name: Zip app
        run: |
          cd build
          rm -f ELC-Responsive.zip
          ditto -c -k --keepParent "ELC Responsive.app" ELC-Responsive.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ELC-Responsive-app
          path: build/ELC-Responsive.zip
          retention-days: 30
